{% extends "base.html" %}

{% block content %}
  <h1>Catálogo de Productos</h1>
  <div class="catalogo">
    {% for producto in productos %}
      <div class="producto">
        <img src="{{ url_for('static', filename='' + producto.foto) }}" alt="{{ producto.nombre }}" width="200">

        <h2>{{ producto.nombre }}</h2>
        <p>Marca: {{ producto.marca }}</p>
        <p>Precio: ${{ producto.precio }}</p>
        <a href="{{ url_for('main.detalle', sku=producto.sku) }}">Ver detalle</a>
      </div>
    {% endfor %}
  </div>
{% endblock %}
